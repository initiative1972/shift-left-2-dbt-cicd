name: dbt_cicd
version: 1.0.0
config-version: 2

# Shift-left dbt portfolio project: pre-commit + Slim CI + unit tests on DuckDB.
profile: dbt_cicd

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_cicd:
    staging:
      +materialized: view
    marts:
      +materialized: table
